# Firebase App Hosting configuration for Next.js 15.
# Replace placeholder values in Firebase App Hosting backend configuration.
env:
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://replace-with-your-project.supabase.co
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
    value: replace-with-your-supabase-publishable-key
    availability:
      - BUILD
      - RUNTIME
